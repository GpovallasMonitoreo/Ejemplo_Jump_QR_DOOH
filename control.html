<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control DOOH</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100vh; background-color: #121212; font-family: Arial, sans-serif;
            overflow: hidden; touch-action: manipulation;
        }
        #status { color: white; margin-bottom: 20px; font-size: 18px; text-align: center; padding: 0 20px;}
        
        #jumpBtn {
            width: 250px; height: 250px; border-radius: 50%;
            background-color: #555; 
            color: rgba(0,0,0,0.5); font-size: 36px; font-weight: bold;
            border: 8px solid #333; transition: all 0.2s ease; outline: none;
            text-transform: uppercase;
        }
        
        #jumpBtn.active {
            background-color: #ffeb3b; color: #000;
            border-color: #fbc02d; box-shadow: 0 15px 25px rgba(0,0,0,0.5);
        }
        
        #jumpBtn.active:active {
            transform: scale(0.95); background-color: #fdd835; box-shadow: 0 5px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="status">Conectando a la pantalla...</div>
    <button id="jumpBtn" disabled>Saltar</button>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');

        const statusText = document.getElementById('status');
        const jumpBtn = document.getElementById('jumpBtn');

        if (!roomId) {
            statusText.innerText = "Error: Escanea el QR de la pantalla principal.";
        } else {
            const peer = new Peer({
                config: {
                    'iceServers': [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });
            let conn;

            peer.on('open', () => {
                statusText.innerText = "Conectando al servidor...";
                // Intentamos conectar al ID fijo de la pantalla
                conn = peer.connect(roomId, {
                    reliable: true // Aseguramos que los mensajes lleguen
                });

                conn.on('open', () => {
                    statusText.innerText = "¡Conectado! Presiona para jugar.";
                    statusText.style.color = "#00e676";
                    jumpBtn.classList.add('active');
                    jumpBtn.disabled = false;
                });

                conn.on('close', () => {
                    statusText.innerText = "Conexión perdida con la pantalla.";
                    statusText.style.color = "red";
                    jumpBtn.classList.remove('active');
                    jumpBtn.disabled = true;
                });
            });

            peer.on('error', (err) => {
                console.error(err);
                if(err.type === 'peer-unavailable') {
                    statusText.innerText = "La pantalla se desconectó. Intenta recargar la pantalla base y escanea de nuevo.";
                } else {
                    statusText.innerText = "Fallo de red: " + err.type;
                }
                statusText.style.color = "red";
            });

            jumpBtn.addEventListener('touchstart', (e) => {
                e.preventDefault(); 
                if (conn && conn.open) {
                    conn.send('jump');
                    if (navigator.vibrate) navigator.vibrate(50); 
                }
            });

            jumpBtn.addEventListener('mousedown', (e) => {
                if (conn && conn.open) conn.send('jump');
            });
        }
    </script>
</body>
</html>
